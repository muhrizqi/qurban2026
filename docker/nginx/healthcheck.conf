# Custom NGINX config untuk serversideup/php image
# File ini di-copy ke /etc/nginx/conf.d/ di dalam container
# Menambahkan endpoint /healthcheck yang dijawab langsung oleh NGINX
# tanpa melalui PHP-FPM, sehingga tidak akan timeout meski PHP-FPM busy.

server {
    listen 8080;
    server_name _;

    # ── Healthcheck ringan: dijawab NGINX langsung, bypass PHP-FPM ──
    location = /healthcheck {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }
}
